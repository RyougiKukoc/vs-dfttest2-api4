name: Build DFTTest2 packages

on:
  push:
    branches:
      - master
    tags:
      - cpu
      - cu121
      - cu129
    paths:
      - "CMakeLists.txt"
      - "common/**"
      - "cpu_source/**"
      - "cuda_source/**"
      - "dfttest2/**"
      - "dfttest2.py"
      - "hatch_build.py"
      - "nvrtc_source/**"
      - "pyproject.toml"
      - "tools/**"
      - ".github/workflows/windows.yml"
  pull_request:
    paths:
      - "CMakeLists.txt"
      - "common/**"
      - "cpu_source/**"
      - "cuda_source/**"
      - "dfttest2/**"
      - "dfttest2.py"
      - "hatch_build.py"
      - "nvrtc_source/**"
      - "pyproject.toml"
      - "tools/**"
      - ".github/workflows/windows.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.variant }}
    runs-on: windows-2025

    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: cpu
            cuda_enabled: false
            cuda_version: ""
            cudart_version: ""
            nvrtc_version: ""
            nvcc_version: ""
            nvjitlink_version: ""
            cufft_version: ""
            extra_cuda_packages: ""
          - variant: cu121
            cuda_enabled: true
            cuda_version: 12.1.1
            cudart_version: 12.1.105
            nvrtc_version: 12.1.105
            nvcc_version: 12.1.105
            nvjitlink_version: 12.1.105
            cufft_version: 11.0.2.54
            extra_cuda_packages: ""
          - variant: cu129
            cuda_enabled: true
            cuda_version: 12.9.1
            cudart_version: 12.9.79
            nvrtc_version: 12.9.86
            nvcc_version: 12.9.86
            nvjitlink_version: 12.9.86
            cufft_version: 11.4.1.4
            extra_cuda_packages: "libnvfatbin=12.9.82 libnvfatbin-dev=12.9.82 libnvfatbin-static=12.9.82"

    defaults:
      run:
        shell: cmd

    env:
      DFTTEST2_VARIANT: ${{ matrix.variant }}
      DFTTEST2_CUDA_VARIANT: ${{ matrix.variant }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up CPython
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python build tools
        run: >-
          "%pythonLocation%\python.exe" -m pip install --upgrade pip build hatchling packaging cmake ninja "VapourSynth==79"

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install CUDA static packages
        if: ${{ matrix.cuda_enabled }}
        id: cuda
        uses: mamba-org/setup-micromamba@v3
        with:
          environment-name: cuda-${{ matrix.variant }}
          init-shell: none
          cache-downloads: true
          post-cleanup: environment
          condarc: |
            channels:
              - conda-forge
            channel_priority: strict
          create-args: >-
            cuda-cudart-dev=${{ matrix.cudart_version }}
            cuda-nvrtc=${{ matrix.nvrtc_version }}
            cuda-nvrtc-dev=${{ matrix.nvrtc_version }}
            cuda-nvrtc-static=${{ matrix.nvrtc_version }}
            cuda-nvcc=${{ matrix.nvcc_version }}
            libnvjitlink=${{ matrix.nvjitlink_version }}
            libnvjitlink-dev=${{ matrix.nvjitlink_version }}
            libnvjitlink-static=${{ matrix.nvjitlink_version }}
            libcufft=${{ matrix.cufft_version }}
            libcufft-dev=${{ matrix.cufft_version }}
            ${{ matrix.extra_cuda_packages }}

      - name: Show CUDA package layout
        if: ${{ matrix.cuda_enabled }}
        run: |
          set "CUDA_ROOT=${{ steps.cuda.outputs.environment-path }}\Library"
          echo CUDA_ROOT=%CUDA_ROOT%
          dir "%CUDA_ROOT%\include\nvrtc.h"
          dir "%CUDA_ROOT%\lib\cuda.lib"
          dir "%CUDA_ROOT%\lib\nvrtc_static.lib"
          dir "%CUDA_ROOT%\lib\nvrtc-builtins_static.lib"
          dir "%CUDA_ROOT%\lib\nvptxcompiler_static.lib"
          dir "%CUDA_ROOT%\lib\cufft.lib"
          dir "%CUDA_ROOT%\bin\cufft64_*.dll"

      - name: Prepare VapourSynth R77 wheel
        run: >-
          "%pythonLocation%\python.exe" tools\ci_prepare_windows.py

      - name: Build CPU-only package directory
        if: ${{ !matrix.cuda_enabled }}
        run: >-
          "%pythonLocation%\python.exe" tools\ci_build_windows.py
          --clean
          --variant ${{ matrix.variant }}
          --dist-dir dist\windows-${{ matrix.variant }}

      - name: Build CPU/CUDA package directory
        if: ${{ matrix.cuda_enabled }}
        run: >-
          "%pythonLocation%\python.exe" tools\ci_build_windows.py
          --clean
          --variant ${{ matrix.variant }}
          --dist-dir dist\windows-${{ matrix.variant }}
          --cuda-root "${{ steps.cuda.outputs.environment-path }}\Library"

      - name: Smoke-load explicit package
        run: >-
          "%pythonLocation%\python.exe" tools\smoke_load_artifact.py
          --vapoursynth-root _deps\vapoursynth-wheel-R77
          --artifact-dir dist\windows-${{ matrix.variant }}
          --exercise-cpu-filter

      - name: Smoke-load package through manifest autoload
        run: >-
          "%pythonLocation%\python.exe" tools\smoke_load_artifact.py
          --vapoursynth-root _deps\vapoursynth-wheel-R77
          --artifact-dir dist\windows-${{ matrix.variant }}
          --autoload
          --exercise-cpu-filter

      - name: Test native contracts, helper behavior, and autoload isolation
        # The native negative tests run before packaging; GPU format rejection
        # is checked before driver initialization on hosted runners.
        # Runtime GPU identity tests are available via --gpu on an NVIDIA host.
        run: >-
          "%pythonLocation%\python.exe" tools\test_regressions.py
          --vapoursynth-root _deps\vapoursynth-wheel-R77
          --artifact-dir dist\windows-${{ matrix.variant }}

      - name: Pack release zip
        run: >-
          "%pythonLocation%\python.exe" tools\package_plugin_zip.py
          --variant ${{ matrix.variant }}
          --input-dir dist\windows-${{ matrix.variant }}
          --output dist\dfttest2-${{ matrix.variant }}-win64.zip

      - name: Build wheel from local prebuilt package
        env:
          DFTTEST2_PREBUILT_URL: ${{ github.workspace }}\dist\dfttest2-${{ matrix.variant }}-win64.zip
        run: >-
          "%pythonLocation%\python.exe" -m build --wheel --no-isolation --outdir dist\wheels-${{ matrix.variant }}

      - name: Install built wheel
        run: >-
          for %%I in (dist\wheels-${{ matrix.variant }}\*.whl) do "%pythonLocation%\python.exe" -m pip install --force-reinstall "%%~fI"

      - name: Smoke test installed wheel
        run: >-
          "%pythonLocation%\python.exe" tools\smoke_installed_wheel.py --exercise-cpu-filter

      - name: Smoke test source install with prebuilt package
        env:
          DFTTEST2_PREBUILT_URL: ${{ github.workspace }}\dist\dfttest2-${{ matrix.variant }}-win64.zip
        run: |
          "%pythonLocation%\python.exe" -m pip uninstall -y vapoursynth-dfttest2
          "%pythonLocation%\python.exe" -m pip install --force-reinstall --no-deps --no-build-isolation -v .
          "%pythonLocation%\python.exe" tools\smoke_installed_wheel.py --exercise-cpu-filter

      - name: Upload package directory
        # Preserve the exact native binaries when a regression fails so they
        # can be investigated without publishing a release.
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: dfttest2-${{ matrix.variant }}-package
          path: dist/windows-${{ matrix.variant }}

      - name: Upload release zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: dfttest2-${{ matrix.variant }}-release-zip
          path: dist/dfttest2-${{ matrix.variant }}-win64.zip

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: dfttest2-${{ matrix.variant }}-wheel-win64
          path: dist/wheels-${{ matrix.variant }}

  build-linux:
    name: Build Linux ${{ matrix.variant }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: cpu
            image: quay.io/pypa/manylinux2014_x86_64
            wheel_tag: manylinux_2_27_x86_64
            cuda: false
          - variant: cu121
            image: nvidia/cuda:12.1.1-devel-ubi8
            wheel_tag: manylinux_2_27_x86_64
            cuda: true
          - variant: cu129
            image: nvidia/cuda:12.9.1-devel-ubi8
            wheel_tag: manylinux_2_27_x86_64
            cuda: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build CPU payload in manylinux2014
        if: ${{ !matrix.cuda }}
        run: |
          docker run --rm -v "$PWD:/workspace" -w /workspace ${{ matrix.image }} bash -lc '
            set -eux
            export PY=/opt/python/cp313-cp313/bin/python
            export PATH=/opt/python/cp313-cp313/bin:$PATH
            $PY -m pip install --disable-pip-version-check ninja
            rm -rf /tmp/vs-sdk
            mkdir -p /tmp/vs-sdk /tmp/vs-wheel
            $PY -m pip download --disable-pip-version-check VapourSynth==79 --only-binary=:all: --no-deps --platform manylinux_2_27_x86_64 --implementation cp --python-version 313 --abi abi3 --dest /tmp/vs-wheel
            unzip -q /tmp/vs-wheel/*.whl -d /tmp/vs-sdk
            $PY tools/ci_build_native.py --clean --variant cpu --vapoursynth-root /tmp/vs-sdk --dist-dir dist/linux-cpu
            $PY tools/package_plugin_zip.py --platform linux-x86_64 --variant cpu --input-dir dist/linux-cpu --output dist/dfttest2-cpu-linux-x86_64.zip
            readelf --version-info dist/linux-cpu/dfttest2/dfttest2_cpu.so
          '

      - name: Build CUDA payload in UBI 8
        if: ${{ matrix.cuda }}
        run: |
          docker run --rm -v "$PWD:/workspace" -w /workspace ${{ matrix.image }} bash -lc '
            set -eux
            dnf install -y python39 python39-pip cmake ninja-build gcc-toolset-12-gcc-c++ unzip pkgconf-pkg-config
            source /opt/rh/gcc-toolset-12/enable
            python3.9 -m pip install --upgrade pip
            rm -rf /tmp/vs-sdk
            mkdir -p /tmp/vs-sdk /tmp/vs-wheel
            python3.9 -m pip download --disable-pip-version-check VapourSynth==79 --only-binary=:all: --no-deps --platform manylinux_2_28_x86_64 --implementation cp --python-version 313 --abi abi3 --dest /tmp/vs-wheel
            unzip -q /tmp/vs-wheel/*.whl -d /tmp/vs-sdk
            python3.9 tools/ci_build_native.py --clean --variant ${{ matrix.variant }} --vapoursynth-root /tmp/vs-sdk --cuda-root /usr/local/cuda --dist-dir dist/linux-${{ matrix.variant }}
            python3.9 tools/package_plugin_zip.py --platform linux-x86_64 --variant ${{ matrix.variant }} --input-dir dist/linux-${{ matrix.variant }} --output dist/dfttest2-${{ matrix.variant }}-linux-x86_64.zip
            readelf --version-info dist/linux-${{ matrix.variant }}/dfttest2/dfttest2_nvrtc.so
            readelf --version-info dist/linux-${{ matrix.variant }}/dfttest2/dfttest2_cuda.so
          '

      - name: Upload Linux release zip
        uses: actions/upload-artifact@v4
        with:
          name: dfttest2-${{ matrix.variant }}-release-zip-linux
          path: dist/dfttest2-${{ matrix.variant }}-linux-x86_64.zip

  validate-linux:
    name: Validate Linux ${{ matrix.variant }}
    needs: build-linux
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: cpu
            wheel_tag: manylinux_2_27_x86_64
          - variant: cu121
            wheel_tag: manylinux_2_27_x86_64
          - variant: cu129
            wheel_tag: manylinux_2_27_x86_64

    steps:
      - name: Checkout smoke helpers
        uses: actions/checkout@v4

      - name: Download Linux release zip
        uses: actions/download-artifact@v4
        with:
          name: dfttest2-${{ matrix.variant }}-release-zip-linux
          path: dist

      - name: Set up CPython
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install validation dependencies
        run: python -m pip install --upgrade build cmake hatchling ninja packaging "VapourSynth==79"

      - name: Inspect and explicitly load release payload
        run: |
          unzip -q dist/dfttest2-${{ matrix.variant }}-linux-x86_64.zip -d release
          test -f release/dfttest2/dfttest2_cpu.so
          test -f release/dfttest2/manifest.vs
          python tools/check_linux_abi.py release/dfttest2 --max-glibc 2.27 --max-glibcxx 3.4.22
          python tools/smoke_linux_package.py --artifact-zip dist/dfttest2-${{ matrix.variant }}-linux-x86_64.zip --skip-cuda

      - name: Build wheel from the tested Linux payload
        env:
          DFTTEST2_PREBUILT_URL: ${{ github.workspace }}/dist/dfttest2-${{ matrix.variant }}-linux-x86_64.zip
          DFTTEST2_VARIANT: ${{ matrix.variant }}
          DFTTEST2_WHEEL_PLATFORM_TAG: ${{ matrix.wheel_tag }}
        run: python -m build --wheel --no-isolation --outdir dist/wheels-linux-${{ matrix.variant }}

      - name: Inspect wheel native ABI
        run: |
          unzip -q dist/wheels-linux-${{ matrix.variant }}/*.whl -d wheel
          find wheel/vapoursynth/plugins/dfttest2 -type f -name '*.so' -print -exec readelf --version-info {} \;
          python tools/check_linux_abi.py wheel/vapoursynth/plugins/dfttest2 --max-glibc 2.27 --max-glibcxx 3.4.22

      - name: Install and autoload CPU wheel
        if: ${{ matrix.variant == 'cpu' }}
        run: |
          python -m pip install --force-reinstall --no-deps dist/wheels-linux-cpu/*.whl
          python tools/smoke_linux_package.py --installed

      - name: Upload Linux wheel
        uses: actions/upload-artifact@v4
        with:
          name: dfttest2-${{ matrix.variant }}-wheel-linux
          path: dist/wheels-linux-${{ matrix.variant }}

  publish:
    name: Publish selected variant release
    if: ${{ startsWith(github.ref, 'refs/tags/') && (github.ref_name == 'cpu' || github.ref_name == 'cu121' || github.ref_name == 'cu129') }}
    needs: [build, build-linux, validate-linux]
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Checkout smoke helpers
        uses: actions/checkout@v4

      - name: Download all release assets
        uses: actions/download-artifact@v4
        with:
          path: assets

      - name: Upload one Windows/Linux asset set
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -eux
          assets=(
            "$(find "assets/dfttest2-${TAG}-release-zip" -type f -name "dfttest2-${TAG}-win64.zip")"
            "$(find "assets/dfttest2-${TAG}-wheel-win64" -type f -name 'vapoursynth_dfttest2-*-win_amd64.whl')"
            "$(find "assets/dfttest2-${TAG}-release-zip-linux" -type f -name "dfttest2-${TAG}-linux-x86_64.zip")"
            "$(find "assets/dfttest2-${TAG}-wheel-linux" -type f -name 'vapoursynth_dfttest2-*-manylinux_*.whl')"
          )
          for asset in "${assets[@]}"; do test -n "$asset"; done
          test "${#assets[@]}" -eq 4
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "${assets[@]}" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" "${assets[@]}" --title "$TAG" --notes "Automated DFTTest2 ${TAG} Windows and Linux build." --repo "$GITHUB_REPOSITORY"
          fi

      - name: Prove remote VCS asset selection
        env:
          TAG: ${{ github.ref_name }}
        run: |
          python -m pip install --upgrade "VapourSynth==79"
          python -m pip install --force-reinstall --no-deps -v "vapoursynth-dfttest2 @ git+https://github.com/${GITHUB_REPOSITORY}.git@${TAG}" 2>&1 | tee pip-vcs.log
          grep "DFTTest2 wheel build: using ${TAG} prebuilt release asset" pip-vcs.log
          test -f "$(python -c 'import vapoursynth; print(vapoursynth.__path__[0])')/plugins/dfttest2/dfttest2_cpu.so"
          if [ "$TAG" = cpu ]; then python tools/smoke_linux_package.py --installed; fi
